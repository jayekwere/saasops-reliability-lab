services:
  saasops-reliability-lab:
    build: .
    ports: ['127.0.0.1:4430:4430']
    environment:
      DEMO: '1'
      BASE_URL: 'http://127.0.0.1:4430'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
